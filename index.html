<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EarnLink – টাস্ক করুন, পয়েন্ট জিতুন</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
--bg:#f3f1ff;--card:#fff;--tx:#1d1b3a;--mut:#6f6c8f;--pri:#7c3aed;--pri2:#efe9ff;--ok:#059669;--bad:#e11d48;--bd:#e5e0fa;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12101f;--card:#1c1930;--tx:#ece9ff;--mut:#a29fc4;--pri:#a78bfa;--pri2:#2a2447;--ok:#34d399;--bad:#fb7185;--bd:#2f2a50;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12101f;--card:#1c1930;--tx:#ece9ff;--mut:#a29fc4;--pri:#a78bfa;--pri2:#2a2447;--ok:#34d399;--bad:#fb7185;--bd:#2f2a50;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 100px}
.hero{background:linear-gradient(135deg,#7c3aed,#db2777 60%,#f59e0b);color:#fff;border-radius:0 0 26px 26px;padding:16px 16px 20px;box-shadow:0 8px 24px #7c3aed44}
.hero .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero b.big{font-size:38px;line-height:1.1;display:block;margin-top:8px}
.badge{background:#ffffff30;border-radius:99px;padding:3px 12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.stat{border-radius:16px;padding:12px;color:#fff}
.stat b{display:block;font-size:24px}.stat span{font-size:13px;opacity:.9}
.g1{background:linear-gradient(135deg,#f97316,#ef4444)}.g2{background:linear-gradient(135deg,#06b6d4,#3b82f6)}.g3{background:linear-gradient(135deg,#10b981,#84cc16)}.g4{background:linear-gradient(135deg,#8b5cf6,#ec4899)}
button{font:inherit;border:0;border-radius:12px;padding:9px 14px;background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;cursor:pointer;font-weight:600}
button.sec{background:var(--pri2);color:var(--pri)}button.bad{background:var(--bad)}button.ok{background:var(--ok)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.task{--h:260;border-left:5px solid hsl(var(--h) 75% 55%)}
.task .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:hsl(var(--h) 75% 55%/.18)}
.task button:not(:disabled){background:hsl(var(--h) 75% 50%)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--pri2);color:var(--pri)}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}
.mut{color:var(--mut);font-size:13px}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#ec4899);width:0;transition:width .4s}
.ad{border:2px dashed var(--bd);border-radius:14px;padding:18px;text-align:center;color:var(--mut);margin:0 0 12px;font-size:13px}
.bn{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.bn button{flex:1;background:none;color:var(--mut);font-size:12px;padding:6px 2px;border-radius:10px}
.bn button.on{color:var(--pri);background:var(--pri2)}.bn span{display:block;font-size:20px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1d1b3a;color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:9;max-width:90%}
.auth{max-width:400px;margin:0 auto;padding:30px 14px}
.mode{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:#fef3c7;color:#92400e}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
/* ======== কনফিগারেশন (নিজের তথ্য বসান) ======== */
const FB_CFG=null; // Firebase Web config: {apiKey:"..",authDomain:"..",projectId:"..",appId:".."} — null থাকলে ডেমো মোড
const ADS={client:'',slot:''}; // AdSense: client:'ca-pub-XXXXXXXXXXXXXXXX', slot:'1234567890'
/* ============================================ */
const FB=!!FB_CFG;let fs,au,subs=[];
const K='ptc_demo_v2';
const TT=[['📰','আর্টিকেল পড়ুন'],['🎬','ভিডিও দেখুন'],['🧠','কুইজ খেলুন'],['🛍️','অফার দেখুন'],['📱','অ্যাপ দেখুন']];
const seed=()=>Array.from({length:20},(_,i)=>{const[ic,n]=TT[i%5];return{id:'t'+(i+1),ord:i,icon:ic,title:n+' #'+(Math.floor(i/5)+1),url:'https://example.com/?task='+(i+1),sec:10+(i%4)*5,pts:10+(i%4)*5,on:1}});
const LV=[[0,'ব্রোঞ্জ','🥉',0],[10,'সিলভার','🥈',10],[30,'গোল্ড','🥇',20],[70,'প্ল্যাটিনাম','💎',30],[150,'ডায়মন্ড','👑',50]];
const lvl=n=>{let i=0;LV.forEach((l,k)=>{if((n||0)>=l[0])i=k});return i};
const def=()=>({s:{name:'EarnLink',rate:100,minW:1000,ref:50,refMax:20,signup:20,cool:24,streak7:50,devLock:1,admin:'admin',apass:'admin123',notice:'প্রতিদিন লগইন করে বোনাস নিন!'},u:[],w:[],l:[],r:[],dev:{},t:seed()});
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}D=D||def();D.r=D.r||[];D.dev=D.dev||{};
if(FB){D.t=[];D.u=[];D.w=[];D.l=[];D.r=[]}
let me=null,adm=false,tab='home',authMode='login',tick=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,9);
const U=()=>D.u.find(x=>x.id===me);
const tk=p=>'৳'+(p/D.s.rate).toFixed(2);
const fmt=t=>new Date(t).toLocaleString('bn-BD');
const today=()=>new Date().toISOString().slice(0,10);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)}
function sv(col,o){if(FB)fs.collection(col).doc(o.id).set(JSON.parse(JSON.stringify(o)),{merge:true}).catch(e=>toast('Error: '+e.code));else try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
function log(u,txt,p){const o={id:rid(),u,txt,p,at:Date.now()};D.l.unshift(o);sv('logs',o)}

/* ---------- ডিভাইস ফিঙ্গারপ্রিন্ট ---------- */
async function devKeys(){let id=null;try{id=localStorage.getItem('did')}catch(e){}
 if(!id){id=rid()+rid()+rid();try{localStorage.setItem('did',id)}catch(e){}}
 let cv='';try{const c=document.createElement('canvas').getContext('2d');c.font='14px Arial';c.fillText('EarnLink✓',2,15);cv=c.canvas.toDataURL()}catch(e){}
 const raw=[navigator.userAgent,screen.width,screen.height,screen.colorDepth,navigator.language,navigator.hardwareConcurrency,Intl.DateTimeFormat().resolvedOptions().timeZone,cv].join('|');
 let h=id;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,40)}catch(e){}
 return['a'+h,'b'+id]}
async function findRef(code){if(!code)return null;if(FB){const d=await fs.doc('codes/'+code).get();return d.exists?d.data().u:null}return D.u.find(x=>x.code===code)?.id||null}

/* ---------- Auth ---------- */
function authView(){
 const ref=new URLSearchParams(location.search).get('ref')||'',reg=authMode==='reg';
 return `<div class="hero" style="border-radius:0 0 40px 40px;text-align:center;padding:40px 16px"><div style="font-size:48px">💰</div><b style="font-size:30px">${esc(D.s.name)}</b><div>টাস্ক করুন • পয়েন্ট জিতুন • টাকা তুলুন</div></div>
 <div class="auth"><div class="card"><div style="text-align:center;margin-bottom:8px">${FB?'':'<span class="mode">ডেমো মোড – ডেটা শুধু এই ব্রাউজারে</span>'}</div>
 <label>ইউজারনেম</label><input id="a_u" autocomplete="username">
 <label>পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label><input id="a_p" type="password" autocomplete="current-password">
 ${reg?`<label>রেফার কোড (ঐচ্ছিক)</label><input id="a_r" value="${esc(ref)}">`:''}
 <button style="width:100%" onclick="doAuth()">${reg?'রেজিস্টার করুন':'লগইন'}</button>
 <p style="text-align:center"><a href="#" onclick="authMode='${reg?'login':'reg'}';render();return false">${reg?'একাউন্ট আছে? লগইন':'নতুন একাউন্ট খুলুন'}</a></p>
 ${FB?'':`<p class="mut" style="text-align:center">ডেমো অ্যাডমিন: ${esc(D.s.admin)} / ${esc(D.s.apass)}</p>`}</div></div>`}
async function doAuth(){
 const n=$('#a_u').value.trim().toLowerCase(),p=$('#a_p').value,em=n+'@earnlink.app';
 if(!/^[a-z0-9_]{3,20}$/.test(n)||p.length<6)return toast('ইউজারনেম (ইংরেজি/সংখ্যা, ৩+) ও পাসওয়ার্ড ৬+ অক্ষর দিন');
 try{
  if(!FB&&n===D.s.admin&&p===D.s.apass){adm=true;tab='dash';return render()}
  if(authMode==='reg'){
   const keys=await devKeys(),by=await findRef(($('#a_r')?.value||'').trim().toUpperCase());let id;
   if(FB){const c=await au.createUserWithEmailAndPassword(em,p);id=c.user.uid;
    if(D.s.devLock)for(const k of keys){if((await fs.doc('devices/'+k).get()).exists){await c.user.delete();return toast('এই ডিভাইস থেকে আগেই একাউন্ট খোলা হয়েছে')}}}
   else{if(D.u.some(x=>x.name===n))return toast('এই ইউজারনেম আছে');
    if(D.s.devLock&&keys.some(k=>D.dev[k]))return toast('এই ডিভাইস থেকে আগেই একাউন্ট খোলা হয়েছে');id=rid()}
   const u={id,name:n,pts:D.s.signup,code:rid().toUpperCase().slice(0,6),by:by&&by!==id?by:null,banned:0,done:{},pend:null,tasks:0,streak:0,last:'',joined:Date.now()};
   if(!FB)u.pass=p;
   keys.forEach(k=>{if(FB)fs.doc('devices/'+k).set({u:id});else D.dev[k]=id});
   if(FB)fs.doc('codes/'+u.code).set({u:id});
   if(u.by)(FB?sv:((c,o)=>D.r.push(o)))('refs',{id,by:u.by,ok:0,paid:0});
   if(!FB){D.u.push(u);me=id}
   sv('users',u);if(D.s.signup)log(id,'সাইনআপ বোনাস',D.s.signup);tab='home';toast('স্বাগতম! 🎉');return render()}
  if(FB)await au.signInWithEmailAndPassword(em,p);
  else{const u=D.u.find(x=>x.name===n&&x.pass===p);if(!u)return toast('ইউজারনেম/পাসওয়ার্ড ভুল');me=u.id;tab='home';render()}
 }catch(e){toast(e.code==='auth/email-already-in-use'?'এই ইউজারনেম আছে':e.code==='auth/invalid-credential'?'ইউজারনেম/পাসওয়ার্ড ভুল':(e.message||'সমস্যা হয়েছে'))}}
function logout(){if(FB)au.signOut();me=null;adm=false;authMode='login';render()}

/* ---------- Firebase boot ---------- */
const ld=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function boot(){
 if(!FB)return render();
 $('#app').innerHTML='<p style="text-align:center;padding:40px">লোড হচ্ছে…</p>';
 try{const b='https://cdn.jsdelivr.net/npm/firebase@10.12.2/';
  await ld(b+'firebase-app-compat.js');await Promise.all([ld(b+'firebase-auth-compat.js'),ld(b+'firebase-firestore-compat.js')]);
  firebase.initializeApp(FB_CFG);fs=firebase.firestore();au=firebase.auth();au.onAuthStateChanged(onUser)}
 catch(e){$('#app').innerHTML='<p style="padding:30px">Firebase লোড হয়নি। কনফিগ ও নেটওয়ার্ক দেখুন।</p>'}}
async function onUser(us){
 subs.forEach(f=>f());subs=[];D.u=[];D.w=[];D.l=[];D.r=[];
 if(!us){me=null;adm=false;return render()}
 me=us.uid;adm=(await fs.doc('admins/'+me).get().catch(()=>({exists:false}))).exists;tab=adm?'dash':'home';
 const on=(q,f)=>subs.push(q.onSnapshot(s=>{f(s);render(1)},e=>console.warn(e.code)));
 const arr=s=>s.docs.map(d=>({id:d.id,...d.data()}));
 on(fs.doc('config/main'),s=>{if(s.exists)D.s={...D.s,...s.data()}});
 on(fs.collection('tasks'),s=>D.t=arr(s).sort((a,b)=>(a.ord||0)-(b.ord||0)));
 if(adm){on(fs.collection('users'),s=>D.u=arr(s));on(fs.collection('withdrawals'),s=>D.w=arr(s).sort((a,b)=>b.at-a.at))}
 else{on(fs.doc('users/'+me),s=>D.u=s.exists?[{id:s.id,...s.data()}]:[]);
  on(fs.collection('withdrawals').where('u','==',me),s=>D.w=arr(s).sort((a,b)=>b.at-a.at));
  on(fs.collection('logs').where('u','==',me),s=>D.l=arr(s).sort((a,b)=>b.at-a.at).slice(0,60));
  on(fs.collection('refs').where('by','==',me),s=>D.r=arr(s))}
 render()}

/* ---------- টাস্ক, বোনাস ---------- */
function startTask(id){const u=U(),t=D.t.find(x=>x.id===id);if(!t||!u)return;
 const l=u.done[id];if(l&&Date.now()-l<D.s.cool*3600e3)return toast('এই টাস্ক এখন আবার করা যাবে না');
 u.pend={tid:id,start:Date.now()};sv('users',u);window.open(t.url,'_blank','noopener');render()}
function claim(){const u=U();if(!u||!u.pend)return;const t=D.t.find(x=>x.id===u.pend.tid);
 if(!t){u.pend=null;sv('users',u);return render()}
 if((Date.now()-u.pend.start)/1000<t.sec)return toast('আরও একটু অপেক্ষা করুন');
 const g=Math.round(t.pts*(1+LV[lvl(u.tasks)][3]/100)),first=!u.tasks,old=lvl(u.tasks);
 u.pts+=g;u.tasks=(u.tasks||0)+1;u.done[t.id]=Date.now();u.pend=null;log(u.id,'টাস্ক: '+t.title,g);
 if(first&&u.by){if(FB)sv('refs',{id:u.id,by:u.by,ok:1});else{const r=D.r.find(x=>x.id===u.id);if(r)r.ok=1}}
 sv('users',u);toast('+'+g+' পয়েন্ট! '+(lvl(u.tasks)>old?'🎉 লেভেল আপ: '+LV[lvl(u.tasks)][1]:''));render()}
const cancelTask=()=>{const u=U();u.pend=null;sv('users',u);render()};
function daily(){const u=U(),t=today();if(u.last===t)return toast('আজকের বোনাস নেওয়া হয়েছে');
 const y=new Date(Date.now()-864e5).toISOString().slice(0,10);u.streak=u.last===y?(u.streak||0)+1:1;u.last=t;
 let b=Math.min(5+u.streak*2,25),x='';if(u.streak%7===0){b+=D.s.streak7;x=' (৭ দিনের স্ট্রিক বোনাস সহ!)'}
 u.pts+=b;log(u.id,'ডেইলি বোনাস – স্ট্রিক '+u.streak,b);sv('users',u);toast('+'+b+' পয়েন্ট'+x);render()}
function collect(){const u=U();if(!u)return;const open=D.r.filter(r=>r.ok&&!r.paid);if(!open.length)return;
 const can=Math.max(0,D.s.refMax-D.r.filter(r=>r.paid).length),take=open.slice(0,can);if(!take.length)return;
 take.forEach(r=>{r.paid=1;sv('refs',r)});const b=take.length*D.s.ref;u.pts+=b;log(u.id,'রেফার বোনাস ×'+take.length,b);sv('users',u);toast('রেফার বোনাস +'+b)}
function doWd(){const u=U(),amt=parseInt($('#w_a').value),m=$('#w_m').value,no=$('#w_n').value.trim();
 if(!amt||amt<D.s.minW)return toast('ন্যূনতম '+D.s.minW+' পয়েন্ট');if(amt>u.pts)return toast('পর্যাপ্ত পয়েন্ট নেই');
 if(!/^01\d{9}$/.test(no))return toast('সঠিক নম্বর দিন (01XXXXXXXXX)');
 if(D.w.some(w=>w.u===u.id&&w.st==='pending'))return toast('আগের রিকোয়েস্ট পেন্ডিং আছে');
 u.pts-=amt;const w={id:rid(),u:u.id,uname:u.name,amt,m,no,st:'pending',at:Date.now()};D.w.unshift(w);
 log(u.id,'উইথড্র রিকোয়েস্ট',-amt);sv('users',u);sv('withdrawals',w);toast('রিকোয়েস্ট পাঠানো হয়েছে');render()}
function wdSet(id,st){const w=D.w.find(x=>x.id===id);if(!w||w.st!=='pending')return;w.st=st;
 if(st==='rejected'){const u=D.u.find(x=>x.id===w.u);if(u){u.pts+=w.amt;log(u.id,'উইথড্র বাতিল – ফেরত',w.amt);sv('users',u)}}sv('withdrawals',w);render()}

/* ---------- বিজ্ঞাপন (AdSense) ---------- */
const adBox=()=>ADS.client&&ADS.slot?`<ins class="adsbygoogle" style="display:block;margin-bottom:12px" data-ad-client="${esc(ADS.client)}" data-ad-slot="${esc(ADS.slot)}" data-ad-format="auto" data-full-width-responsive="true"></ins>`:'<div class="ad">📢 বিজ্ঞাপনের জায়গা (AdSense)</div>';
function pushAds(){if(!ADS.client)return;if(!window._ads){window._ads=1;const s=document.createElement('script');s.async=1;s.crossOrigin='anonymous';s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+ADS.client;document.head.appendChild(s)}
 document.querySelectorAll('ins.adsbygoogle').forEach(()=>{try{(window.adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}})}

/* ---------- User view ---------- */
const stBn=s=>({pending:'পেন্ডিং',paid:'পরিশোধিত',rejected:'বাতিল'})[s];
const stTag=s=>`<span class="tag ${s==='paid'?'ok':s==='rejected'?'bad':''}">${stBn(s)}</span>`;
function userView(){
 const u=U();if(!u)return '<p style="text-align:center;padding:40px">লোড হচ্ছে…</p>';
 if(u.banned)return `<div class="auth"><div class="card">🚫 আপনার একাউন্ট ব্লক করা হয়েছে।<br><br><button onclick="logout()">লগআউট</button></div></div>`;
 collect();const L=lvl(u.tasks),nx=LV[L+1],pr=nx?Math.min(100,((u.tasks||0)-LV[L][0])/(nx[0]-LV[L][0])*100):100;
 const link=location.href.split('?')[0].split('#')[0]+'?ref='+u.code,paid=D.r.filter(r=>r.paid).length,got=u.last===today();let body='';
 if(tab==='home'){let pend='';
  if(u.pend){const t=D.t.find(x=>x.id===u.pend.tid);if(t)pend=`<div class="card" style="border:2px solid var(--pri)"><b>${t.icon||'⭐'} ${esc(t.title)}</b><p class="mut" id="cd"></p><div class="bar"><i id="pb"></i></div><br>
   <button id="cl" onclick="claim()" disabled>🎁 পয়েন্ট নিন</button> <button class="sec" onclick="startTask('${t.id}')">লিংক আবার খুলুন</button> <button class="sec" onclick="cancelTask()">বাতিল</button></div>`}
  body=`<div class="card row"><div><b>🔥 ডেইলি বোনাস</b><div class="mut">স্ট্রিক: ${u.streak||0} দিন · ৭ দিন পূর্ণ হলে +${D.s.streak7}</div></div><button class="${got?'sec':'ok'}" ${got?'disabled':''} onclick="daily()">${got?'নেওয়া হয়েছে ✓':'বোনাস নিন'}</button></div>`+pend+
  D.t.filter(t=>t.on).map((t,i)=>{const l=u.done[t.id],dn=l&&Date.now()-l<D.s.cool*3600e3,g=Math.round(t.pts*(1+LV[L][3]/100));
   return (i&&i%6===0?adBox():'')+`<div class="card task row" style="--h:${(i*47)%360}"><div class="row" style="justify-content:flex-start"><div class="ic">${t.icon||'⭐'}</div><div><b>${esc(t.title)}</b><div class="mut">⏱ ${t.sec} সেকেন্ড · ⭐ ${g} পয়েন্ট</div></div></div>
   <button ${dn||u.pend?'disabled':''} onclick="startTask('${t.id}')">${dn?'সম্পন্ন ✓':'শুরু করুন'}</button></div>`}).join('')||'<div class="card mut">এখন কোনো টাস্ক নেই</div>'}
 if(tab==='ref')body=`<div class="card"><b>🎁 আপনার রেফার কোড: ${u.code}</b><p class="mut">বন্ধু রেজিস্টার করে প্রথম টাস্ক শেষ করলে আপনি পাবেন ${D.s.ref} পয়েন্ট। সর্বোচ্চ ${D.s.refMax} জন (পেয়েছেন ${paid} জনের)।</p>
  <input readonly value="${esc(link)}" onclick="this.select()"><button onclick="navigator.clipboard?.writeText('${esc(link)}');toast('কপি হয়েছে')">📋 লিংক কপি</button></div>
  <div class="card"><b>মোট রেফারাল: ${D.r.length}</b></div>`+adBox();
 if(tab==='wd')body=`<div class="card"><p class="mut">ন্যূনতম ${D.s.minW} পয়েন্ট (${tk(D.s.minW)}) · ${D.s.rate} পয়েন্ট = ৳১ · অ্যাডমিন যাচাই করে পেমেন্ট দেবেন</p>
  <label>পরিমাণ (পয়েন্ট)</label><input id="w_a" type="number" value="${D.s.minW}"><label>মাধ্যম</label><select id="w_m"><option>bKash</option><option>Nagad</option><option>Rocket</option></select>
  <label>নম্বর</label><input id="w_n" inputmode="numeric" placeholder="01XXXXXXXXX"><button onclick="doWd()">💸 উইথড্র করুন</button></div>
  <div class="card tbl"><table><tr><th>তারিখ</th><th>পরিমাণ</th><th>মাধ্যম</th><th>স্ট্যাটাস</th></tr>${D.w.filter(w=>w.u===u.id).map(w=>`<tr><td>${fmt(w.at)}</td><td>${w.amt}</td><td>${w.m}</td><td>${stTag(w.st)}</td></tr>`).join('')||'<tr><td colspan=4 class="mut">কিছু নেই</td></tr>'}</table></div>`;
 if(tab==='hist')body=`<div class="card tbl"><table><tr><th>তারিখ</th><th>বিবরণ</th><th>পয়েন্ট</th></tr>${D.l.filter(l=>l.u===u.id).slice(0,50).map(l=>`<tr><td>${fmt(l.at)}</td><td>${esc(l.txt)}</td><td style="color:var(${l.p>0?'--ok':'--bad'})">${l.p>0?'+':''}${l.p}</td></tr>`).join('')||'<tr><td colspan=3 class="mut">কিছু নেই</td></tr>'}</table></div>`;
 const nav=[['home','🏠','টাস্ক'],['ref','🎁','রেফার'],['wd','💸','উইথড্র'],['hist','📜','হিস্টোরি']];
 return `<div class="hero"><div class="r"><b>👋 ${esc(u.name)}</b><span><span class="badge">${LV[L][2]} ${LV[L][1]}${LV[L][3]?' · +'+LV[L][3]+'%':''}</span> <button class="sec" onclick="logout()" style="padding:4px 10px">⎋</button></span></div>
  <b class="big">${u.pts} <small style="font-size:16px">পয়েন্ট</small></b><div>≈ ${tk(u.pts)}</div>
  <div style="margin-top:12px" class="bar"><i style="width:${pr}%"></i></div><div style="font-size:12px;margin-top:4px">${nx?`পরের লেভেল (${nx[2]} ${nx[1]}): আরও ${nx[0]-(u.tasks||0)}টি টাস্ক`:'সর্বোচ্চ লেভেল! 👑'}</div></div>
  <div class="wrap"><div class="grid"><div class="stat g1"><b>🔥 ${u.streak||0}</b><span>স্ট্রিক</span></div><div class="stat g2"><b>✅ ${u.tasks||0}</b><span>টাস্ক সম্পন্ন</span></div><div class="stat g3"><b>👥 ${D.r.length}</b><span>রেফারাল</span></div></div>
  <div class="card mut">📢 ${esc(D.s.notice)}</div>${tab==='home'?adBox():''}${body}</div>
  <div class="bn">${nav.map(([k,i,n])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()"><span>${i}</span>${n}</button>`).join('')}</div>`}

/* ---------- Admin view ---------- */
function adminView(){
 const tabs={dash:'📊 ড্যাশবোর্ড',tasks:'📝 টাস্ক',users:'👥 ইউজার',wd:'💸 উইথড্র',set:'⚙️ সেটিংস'};let b='';
 if(tab==='dash')b=`<div class="grid"><div class="stat g1"><b>${D.u.length}</b><span>মোট ইউজার</span></div><div class="stat g2"><b>${D.t.length}</b><span>টাস্ক</span></div><div class="stat g3"><b>${D.u.reduce((a,u)=>a+(u.pts||0),0)}</b><span>ইউজারদের মোট পয়েন্ট</span></div><div class="stat g4"><b>${D.w.filter(w=>w.st==='pending').length}</b><span>পেন্ডিং উইথড্র</span></div></div>`;
 if(tab==='tasks')b=`<div class="card"><b>নতুন টাস্ক</b><div class="grid"><div><label>আইকন (ইমোজি)</label><input id="n_i" value="⭐"></div><div><label>সময় (সেকেন্ড)</label><input id="n_s" type="number" value="10"></div><div><label>পয়েন্ট</label><input id="n_p" type="number" value="10"></div></div>
  <label>টাইটেল</label><input id="n_t"><label>লিংক (আপনার নিজের কনটেন্ট পেজ)</label><input id="n_u" placeholder="https://"><button onclick="addTask()">যোগ করুন</button> <button class="sec" onclick="if(confirm('২০টি ডিফল্ট টাস্ক বসবে (একই আইডি থাকলে বদলে যাবে)'))seedTasks()">২০টি ডিফল্ট টাস্ক সিড</button></div>`
  +D.t.map(t=>`<div class="card row"><div><b>${t.icon||''} ${esc(t.title)}</b><div class="mut" style="word-break:break-all">${esc(t.url)}<br>${t.sec}s · ${t.pts} পয়েন্ট · <span class="tag ${t.on?'ok':'bad'}">${t.on?'চালু':'বন্ধ'}</span></div></div>
  <div><button class="sec" onclick="editTask('${t.id}')">এডিট</button> <button class="sec" onclick="togTask('${t.id}')">${t.on?'বন্ধ':'চালু'}</button> <button class="bad" onclick="delTask('${t.id}')">মুছুন</button></div></div>`).join('');
 if(tab==='users')b=`<div class="card tbl"><table><tr><th>ইউজার</th><th>পয়েন্ট</th><th>টাস্ক</th><th>লেভেল</th><th>স্ট্রিক</th><th>স্ট্যাটাস</th><th></th></tr>${D.u.map(u=>`<tr><td>${esc(u.name)}</td><td>${u.pts}</td><td>${u.tasks||0}</td><td>${LV[lvl(u.tasks)][2]}</td><td>${u.streak||0}</td><td><span class="tag ${u.banned?'bad':'ok'}">${u.banned?'ব্লক':'সক্রিয়'}</span></td>
  <td><button class="sec" onclick="adjPts('${u.id}')">পয়েন্ট</button> <button class="sec" onclick="ban('${u.id}')">${u.banned?'আনব্লক':'ব্লক'}</button></td></tr>`).join('')||'<tr><td colspan=7 class="mut">কোনো ইউজার নেই</td></tr>'}</table></div>`;
 if(tab==='wd')b=`<div class="card tbl"><table><tr><th>ইউজার</th><th>পয়েন্ট (৳)</th><th>মাধ্যম</th><th>নম্বর</th><th>স্ট্যাটাস</th><th></th></tr>${D.w.map(w=>`<tr><td>${esc(w.uname||D.u.find(x=>x.id===w.u)?.name)}</td><td>${w.amt} (${tk(w.amt)})</td><td>${w.m}</td><td>${esc(w.no)}</td><td>${stTag(w.st)}</td>
  <td>${w.st==='pending'?`<button class="ok" onclick="wdSet('${w.id}','paid')">পরিশোধ</button> <button class="bad" onclick="wdSet('${w.id}','rejected')">বাতিল</button>`:''}</td></tr>`).join('')||'<tr><td colspan=6 class="mut">কোনো রিকোয়েস্ট নেই</td></tr>'}</table></div>`;
 if(tab==='set'){const s=D.s,f=(k,l,t='number')=>`<div><label>${l}</label><input id="s_${k}" type="${t}" value="${esc(s[k])}"></div>`;
  b=`<div class="card"><div class="grid">${f('name','সাইটের নাম','text')}${f('rate','কত পয়েন্টে ৳১')}${f('minW','ন্যূনতম উইথড্র (পয়েন্ট)')}${f('ref','রেফার বোনাস')}${f('refMax','সর্বোচ্চ রেফার বোনাস (জন)')}${f('signup','সাইনআপ বোনাস')}${f('cool','টাস্ক রিপিট (ঘণ্টা)')}${f('streak7','৭ দিনের স্ট্রিক বোনাস')}
  <div><label>ডিভাইস লক</label><select id="s_devLock"><option value="1" ${s.devLock?'selected':''}>চালু</option><option value="0" ${s.devLock?'':'selected'}>বন্ধ (টেস্টের জন্য)</option></select></div></div>
  ${f('notice','নোটিশ','text')}${FB?'':f('admin','অ্যাডমিন ইউজারনেম (ডেমো)','text')+f('apass','অ্যাডমিন পাসওয়ার্ড (ডেমো)','text')}
  <button onclick="saveSet()">সেভ</button> ${FB?'':`<button class="bad" onclick="if(confirm('সব ডেটা মুছবে?')){D=def();sv();logout()}">ডেটা রিসেট</button>`}</div>`}
 return `<div class="hero"><div class="r"><b>🛠 অ্যাডমিন প্যানেল</b><button class="sec" onclick="logout()">লগআউট</button></div></div><div class="wrap"><div class="tabs" style="margin-top:12px">${Object.entries(tabs).map(([k,v])=>`<button class="${tab===k?'':'sec'}" onclick="tab='${k}';render()">${v}</button>`).join('')}</div>${b}</div>`}
const putT=t=>{if(FB)fs.doc('tasks/'+t.id).set(t);else{const i=D.t.findIndex(x=>x.id===t.id);i<0?D.t.push(t):D.t[i]=t;sv()}};
function addTask(){const t=$('#n_t').value.trim(),u=$('#n_u').value.trim();if(!t||!/^https?:\/\//.test(u))return toast('টাইটেল ও সঠিক লিংক দিন');
 putT({id:rid(),ord:D.t.length,icon:$('#n_i').value||'⭐',title:t,url:u,sec:+$('#n_s').value||10,pts:+$('#n_p').value||1,on:1});render()}
function editTask(id){const t=D.t.find(x=>x.id===id),u=prompt('নতুন লিংক',t.url);if(u&&/^https?:\/\//.test(u)){t.url=u;t.title=prompt('টাইটেল',t.title)||t.title;t.pts=+prompt('পয়েন্ট',t.pts)||t.pts;t.sec=+prompt('সেকেন্ড',t.sec)||t.sec;putT(t);render()}}
const togTask=id=>{const t=D.t.find(x=>x.id===id);t.on=t.on?0:1;putT(t);render()};
const delTask=id=>{if(!confirm('মুছবেন?'))return;if(FB)fs.doc('tasks/'+id).delete();else{D.t=D.t.filter(x=>x.id!==id);sv()}render()};
const ban=id=>{const u=D.u.find(x=>x.id===id);u.banned=u.banned?0:1;sv('users',u);render()};
function adjPts(id){const u=D.u.find(x=>x.id===id),v=parseInt(prompt('পয়েন্ট যোগ/বিয়োগ (যেমন 50 বা -50)','0'));if(!v)return;u.pts=Math.max(0,u.pts+v);log(id,'অ্যাডমিন অ্যাডজাস্ট',v);sv('users',u);render()}
function seedTasks(){seed().forEach(putT);if(FB)saveSet(1);render()}
function saveSet(q){const s=D.s;if(!q){['name','notice','admin','apass'].forEach(k=>{const e=$('#s_'+k);if(e)s[k]=e.value.trim()||s[k]});
 ['rate','minW','ref','refMax','signup','cool','streak7'].forEach(k=>s[k]=Math.max(0,+$('#s_'+k).value)||(k==='rate'?100:0));s.devLock=+$('#s_devLock').value}
 if(FB){const c={...s};delete c.admin;delete c.apass;fs.doc('config/main').set(c,{merge:true})}else sv();if(!q){toast('সেভ হয়েছে');render()}}

/* ---------- Render ---------- */
function render(soft){
 if(soft&&['INPUT','SELECT'].includes(document.activeElement?.tagName))return;
 $('#app').innerHTML=adm?adminView():me?userView():authView();
 clearInterval(tick);const u=me&&!adm&&U();
 if(u&&u.pend&&tab==='home'){const t=D.t.find(x=>x.id===u.pend.tid);if(t){const up=()=>{const el=(Date.now()-u.pend.start)/1000,left=Math.max(0,Math.ceil(t.sec-el)),cd=$('#cd');if(!cd)return;
  cd.textContent=left?`নতুন ট্যাবে ${t.sec} সেকেন্ড থাকুন — বাকি: ${left}s`:'সময় শেষ! এখন পয়েন্ট নিন।';$('#pb').style.width=Math.min(100,el/t.sec*100)+'%';$('#cl').disabled=left>0;if(!left)clearInterval(tick)};up();tick=setInterval(up,500)}}
 pushAds()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me&&!adm&&U()?.pend&&tab==='home')render()});
boot();
</script>
</body>
</html>
