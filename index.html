async function devKeys(){let id=null;try{id=localStorage.getItem('did')}catch(e){}
 if(!id){id=rid()+rid()+rid();try{localStorage.setItem('did',id)}catch(e){}}
 let cv='';try{const c=document.createElement('canvas').getContext('2d');c.font='14px Arial';c.fillText('EarnLink✓',2,15);cv=c.canvas.toDataURL()}catch(e){}
 const raw=[navigator.userAgent,screen.width,screen.height,screen.colorDepth,navigator.language,navigator.hardwareConcurrency,Intl.DateTimeFormat().resolvedOptions().timeZone,cv].join('|');
 let h=id;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,40)}catch(e){}
 return['a'+h,'b'+id]}

async function onUser(us){

 me=us.uid;adm=(await fs.doc('admins/'+me).get().catch(()=>({exists:false}))).exists;tab=adm?'dash':'home';
 const on=(q,f)=>subs.push(q.onSnapshot(s=>{f(s);render(1)},e=>console.warn(e.code)));
 const arr=s=>s.docs.map(d=>({id:d.id,...d.data()}));
 on(fs.doc('config/main'),s=>{if(s.exists)D.s={...D.s,...s.data()}});
 on(fs.collection('tasks'),s=>D.t=arr(s).sort((a,b)=>(a.ord||0)-(b.ord||0)));

 else{on(fs.doc('users/'+me),s=>{D.u=s.exists?[{id:s.id,...s.data()}]:[];const x=D.u[0];if(x&&x.code&&!onUser.h){onUser.h=1;fs.doc('codes/'+x.code).get().then(d=>{if(!d.exists)fs.doc('codes/'+x.code).set({u:me}).catch(()=>{})}).catch(()=>{})}});
  on(fs.collection('withdrawals').where('u','==',me),s=>D.w=arr(s).sort((a,b)=>b.at-a.at));

 if(t.type==='read'){rd={tid:id,i:0,sec:0};scrollTo(0,0);return render()}

function claim(){const u=U();if(!u||!u.pend)return;const t=D.t.find(x=>x.id===u.pend.tid);
 if(!t){u.pend=null;sv('users',u);return render()}
 if((Date.now()-u.pend.start)/1000<t.sec)return toast('আরও একটু অপেক্ষা করুন');
 const g=Math.round(t.pts*(1+LV[lvl(u.tasks)][3]/100)),first=!u.tasks,old=lvl(u.tasks);
 u.pts+=g;u.tasks=(u.tasks||0)+1;u.done[t.id]=Date.now();u.pend=null;log(u.id,'টাস্ক: '+t.title,g);
 if(first&&u.by){if(FB)refOk(u);else{const r=D.r.find(x=>x.id===u.id);if(r)r.ok=1}}
 sv('users',u);boom();toast('+'+g+' SP Coin! '+(lvl(u.tasks)>old?'লেভেল আপ: '+LV[lvl(u.tasks)][1]:''));render()}
const cancelTask=()=>{const u=U();u.pend=null;sv('users',u);render()};
function daily(){const u=U(),t=today();if(u.last===t)return toast('আজকের বোনাস নেওয়া হয়েছে');
 const y=new Date(Date.now()-864e5).toISOString().slice(0,10);u.streak=u.last===y?(u.streak||0)+1:1;u.last=t;
 let b=Math.min(5+u.streak*2,25),x='';if(u.streak%7===0){b+=D.s.streak7;x=' (৭ দিনের স্ট্রিক বোনাস সহ!)'}

function collect(){const u=U();if(!u)return;const mine=D.r.filter(r=>r.by===u.id),open=mine.filter(r=>r.ok&&!r.paid);if(!open.length)return;
 const can=Math.max(0,D.s.refMax-mine.filter(r=>r.paid).length),take=open.slice(0,can);if(!take.length)return;
 take.forEach(r=>{r.paid=1;sv('refs',r)});const b=take.length*D.s.ref;u.pts+=b;log(u.id,'রেফার বোনাস ×'+take.length,b);sv('users',u);toast('রেফার বোনাস +'+b)}

const rdExit=()=>{rd=null;render()};
function addRead(){const t=$('#r_t').value.trim(),per=+$('#r_s').value||15;
 const pages=$('#r_b').value.trim().split(/\n-{3,}\n/).map(x=>{const l=x.trim().split('\n');return{title:l[0].trim(),body:l.slice(1).join('\n').trim()}}).filter(p=>p.title&&p.body);
 if(!t||pages.length<2)return toast('টাইটেল ও কমপক্ষে ২টা পেজ দিন (পেজ আলাদা করতে --- লিখুন)');
 putT({id:rid(),ord:D.t.length,type:'read',icon:$('#r_i').value||'📰',title:t,pages,per,sec:pages.length*per,pts:+$('#r_p').value||20,on:1,url:'',adCode:($('#r_a').value||'').trim()});render()}
const msgCards=u=>D.m.filter(m=>m.to===u.id&&!m.read).map(m=>`<div class="card" style="border:2px solid var(--pri)"><div class="row"><b>${ico('megaphone',18)} অ্যাডমিনের বার্তা</b><span class="mut">${fmt(m.at)}</span></div><p style="margin:8px 0 12px;white-space:pre-wrap">${esc(m.text)}</p><button onclick="readMsg('${m.id}')">${ico('check',16)} বুঝেছি</button></div>`).join('');
const oldMsgs=u=>{const a=D.m.filter(m=>m.to===u.id&&m.read);return a.length?`<div class="card"><b>আগের বার্তা</b>${a.slice(0,8).map(m=>`<div style="padding:8px 0;border-top:1px solid var(--bd)"><div class="mut">${fmt(m.at)}</div><div style="white-space:pre-wrap">${esc(m.text)}</div></div>`).join('')}</div>`:''};
function readMsg(id){const m=D.m.find(x=>x.id===id);if(!m)return;m.read=1;sv('messages',m);render()}
const MT=['আপনার উইথড্র রিকোয়েস্ট যাচাই করা হচ্ছে, একটু অপেক্ষা করুন।','আপনার পেমেন্ট পাঠানো হয়েছে, নম্বরে চেক করে নিন।','আপনার দেওয়া নম্বরটি ভুল, সঠিক নম্বর দিয়ে আবার রিকোয়েস্ট করুন।','আপনার একাউন্টে সন্দেহজনক কার্যকলাপ পাওয়া গেছে, সাপোর্টে যোগাযোগ করুন।','আপনার সমস্যাটি ঠিক করা হয়েছে, এখন আবার চেষ্টা করুন।'];
function msgModal(uid){const u=D.u.find(x=>x.id===uid);if(!u)return;
 const d=document.createElement('div');d.id='mm';d.style.cssText='position:fixed;inset:0;z-index:60;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px';
 d.innerHTML=`<div class="card" style="width:100%;max-width:420px;margin:0"><b>${esc(u.name)}-কে বার্তা পাঠান</b><label style="display:block;margin-top:10px">দ্রুত বার্তা বাছুন</label><select id="mt_s" onchange="$('#mt_t').value=this.value"><option value="">— নিজে লিখব —</option>${MT.map(t=>`<option value="${esc(t)}">${esc(t.slice(0,36))}…</option>`).join('')}</select><label>বার্তা</label><textarea id="mt_t" rows="4" placeholder="ইউজারকে কী জানাতে চান..."></textarea><div class="row"><button class="sec" onclick="$('#mm').remove()">বাতিল</button><button onclick="sendMsg('${uid}')">${ico('check',16)} পাঠান</button></div></div>`;
 document.body.appendChild(d)}
function sendMsg(uid){const t=$('#mt_t').value.trim();if(!t)return toast('বার্তা লিখুন');
 const m={id:rid(),to:uid,text:t,at:Date.now(),read:0};if(!FB)D.m.unshift(m);sv('messages',m);$('#mm').remove();toast('বার্তা পাঠানো হয়েছে')}
async function refOk(u){const r=fs.doc('refs/'+u.id);try{const d=await r.get();if(!d.exists)await r.set({id:u.id,by:u.by,uname:u.name,ok:0,paid:0});await r.update({ok:1})}catch(e){toast('রেফার আপডেট হয়নি: '+(e.code||''))}}
function maintView(prev){const s=D.s;
 const pr=['gear','sparkle','wrench','star','sparkle','gear','coins','sparkle'].map((e,i)=>`<span class="p" style="left:${6+i*12}%;animation-delay:${i*-1.1}s;animation-duration:${8+i%3*2}s">${ico(e,22)}</span>`).join('');
 const btn=prev?'<button class="sec" onclick="document.getElementById(\'mtp\').remove()">প্রিভিউ বন্ধ করুন</button>':'<button class="sec" onclick="logout()">লগআউট</button>';
 return `<div class="mt"><div class="blob b1"></div><div class="blob b2"></div>${pr}<div class="box"><div class="gears"><span class="g-a">${ico('gear',54)}</span><span class="g-b">${ico('gear',38)}</span></div>
 <h1>${esc(s.maintTitle||'সাইট এখন আপডেট হচ্ছে')}</h1><p>${esc(s.maintMsg||'আমরা সাইটটিকে আরও ভালো করছি। অল্প সময় পরে আবার ঘুরে আসুন। আপনার SP Coin সম্পূর্ণ নিরাপদ আছে।')}</p>
 ${s.maintEta?`<div class="eta">${ico('clock',15)} ${esc(s.maintEta)}</div>`:''}<div class="ld"><i></i></div><div style="margin-top:18px">${btn}</div></div></div>`}
function mtPrev(){const d=document.createElement('div');d.id='mtp';d.innerHTML=maintView(1);document.body.appendChild(d)}
function resetTasks(id){const u=D.u.find(x=>x.id===id);if(!u||!confirm(u.name+' এর সব টাস্ক আবার চালু করবেন?'))return;
 u.done={};u.pend=null;if(FB)fs.doc('users/'+id).update({done:{},pend:null}).catch(e=>toast(e.code));else sv('users',u);render()}
function boom(){const cl=['#f59e0b','#ec4899','#6c4cf1','#10b981','#3b82f6','#ef4444'];for(let i=0;i<34;i++){const p=document.createElement('i');p.className='cf';const w=6+Math.random()*7;p.style.cssText=`left:${Math.random()*100}vw;--dx:${(Math.random()-.5)*240}px;animation-delay:${Math.random()*.35}s;width:${w}px;height:${w*(Math.random()>.5?1:2.2)}px;background:${cl[i%6]};border-radius:${Math.random()>.6?'50%':'2px'}`;document.body.appendChild(p);setTimeout(()=>p.remove(),2400)}}
/* ---------- Render ---------- */
function render(soft){
 if(soft&&(rd||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName)))return;
 $('#app').innerHTML=adm?adminView():me?(D.s.maint?maintView():rd?readerView():userView()):authView();
 clearInterval(tick);const u=me&&!adm&&U();if(rd){tick=setInterval(()=>{if(!document.hidden)rd.sec++;rdUp()},1000);rdUp()}
 if(u&&u.pend&&tab==='home'){const t=D.t.find(x=>x.id===u.pend.tid);if(t){const up=()=>{const el=(Date.now()-u.pend.start)/1000,left=Math.max(0,Math.ceil(t.sec-el)),cd=$('#cd');if(!cd)return;
  cd.textContent=left?`নতুন ট্যাবে ${t.sec} সেকেন্ড থাকুন — বাকি: ${left}s`:'সময় শেষ! এখন SP Coin নিন।';$('#pb').style.width=Math.min(100,el/t.sec*100)+'%';$('#cl').disabled=left>0;if(!left)clearInterval(tick)};up();tick=setInterval(up,500)}}
 pushAds()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me&&!adm&&U()?.pend&&tab==='home'&&!rd)render()});
boot();
</script>
</body>
</html>
