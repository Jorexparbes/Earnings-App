<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#7c3aed">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smartpay – টাস্ক করুন, পয়েন্ট জিতুন</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#eef0ff;--bg2:#fdf1fa;--card:#ffffff;--tx:#1e2340;--mut:#707899;--pri:#6c4cf1;--pri2:#ebe7ff;--ok:#10b981;--bad:#ef4444;--bd:#e3e6f5;--sh:0 1px 0 #e3e6f5,0 10px 26px #3b2f7a14;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1121;--bg2:#1a0f2c;--card:#181c33;--tx:#eef0ff;--mut:#9aa2c7;--pri:#9d8cff;--pri2:#272b50;--ok:#34d399;--bad:#f87171;--bd:#2a2f54;--sh:0 1px 0 #2a2f54,0 10px 26px #0006;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1121;--bg2:#1a0f2c;--card:#181c33;--tx:#eef0ff;--mut:#9aa2c7;--pri:#9d8cff;--pri2:#272b50;--ok:#34d399;--bad:#f87171;--bd:#2a2f54;--sh:0 1px 0 #2a2f54,0 10px 26px #0006;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--tx);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;line-height:1.55;font-size:16px;min-height:100vh}
.wrap{max-width:600px;margin:0 auto;padding:16px 14px 120px}
.hero{max-width:600px;margin:0 auto;background:radial-gradient(circle at 88% 12%,#ffffff38,transparent 42%),radial-gradient(circle at 10% 100%,#ffd45a55,transparent 45%),linear-gradient(135deg,#5b3df5,#9b4dff 55%,#ff4d9d);color:#fff;border-radius:0 0 34px 34px;padding:16px 20px 24px;text-align:center;box-shadow:0 12px 30px #6c4cf14d}
.hero .r{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
.hero b.big{display:block;margin-top:10px;font-size:56px;font-weight:800;letter-spacing:-1px;line-height:1.1;text-shadow:0 3px 0 #0002}
.hero .bar{background:#ffffff40}
.badge{background:#ffffff30;border:1px solid #ffffff55;border-radius:99px;padding:3px 12px;font-size:14px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin:0 0 14px;box-shadow:var(--sh);animation:up .35s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.card h2{font-size:22px;line-height:1.35}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:16px 0}
.stat{border-radius:18px;padding:13px;color:#fff}
.stat b{display:block;font-size:24px;font-weight:800}.stat span{font-size:13px;opacity:.93}
.g1{background:linear-gradient(135deg,#ff9a3c,#ef4444);box-shadow:0 5px 0 #b3361f}
.g2{background:linear-gradient(135deg,#38bdf8,#3b82f6);box-shadow:0 5px 0 #1e56b8}
.g3{background:linear-gradient(135deg,#34d399,#16a34a);box-shadow:0 5px 0 #0f7a38}
.g4{background:linear-gradient(135deg,#a78bfa,#ec4899);box-shadow:0 5px 0 #a02c78}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:10px 18px;min-height:44px;color:#fff;cursor:pointer;background:linear-gradient(180deg,#8f73ff,#6c4cf1);box-shadow:0 5px 0 #4a30c4,0 10px 14px #6c4cf14d;text-shadow:0 1px 0 #0003;transition:transform .08s,box-shadow .08s,filter .15s}
button:hover:not(:disabled){filter:brightness(1.08)}
button:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #4a30c4,0 3px 6px #6c4cf133}
button.sec{background:var(--pri2);color:var(--pri);text-shadow:none;box-shadow:0 4px 0 var(--bd),0 8px 10px #0000000a}
button.sec:active:not(:disabled){box-shadow:0 0 0 var(--bd)}
button.ok{background:linear-gradient(180deg,#34d399,#10b981);box-shadow:0 5px 0 #0a7d59,0 10px 14px #10b9814d}
button.ok:active:not(:disabled){box-shadow:0 1px 0 #0a7d59}
button.bad{background:linear-gradient(180deg,#fb7185,#ef4444);box-shadow:0 5px 0 #b91c1c,0 10px 14px #ef44444d}
button.bad:active:not(:disabled){box-shadow:0 1px 0 #b91c1c}
button:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.35);box-shadow:0 3px 0 #0003}
input,select,textarea{font:inherit;width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);margin:4px 0 12px;box-shadow:inset 0 2px 4px #1e23400d}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}
label{font-size:14px;color:var(--mut)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.task{--h:260;padding:14px;border-left:6px solid hsl(var(--h) 80% 58%)}
.task .ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:25px;background:linear-gradient(135deg,hsl(var(--h) 90% 66%/.3),hsl(calc(var(--h) + 40) 90% 62%/.3))}
.task button:not(:disabled){background:linear-gradient(180deg,hsl(var(--h) 85% 64%),hsl(var(--h) 75% 50%));box-shadow:0 5px 0 hsl(var(--h) 70% 33%),0 10px 14px hsl(var(--h) 70% 45%/.35)}
.task button:not(:disabled):active{box-shadow:0 1px 0 hsl(var(--h) 70% 33%)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.tag{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--pri2);color:var(--pri);font-weight:700}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}
.mut{color:var(--mut);font-size:14px}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;box-shadow:inset 0 2px 3px #0002}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#fbbf24,#f472b6);width:0;transition:width .4s;border-radius:9px}
.ad{border:2px dashed var(--bd);border-radius:16px;padding:18px;text-align:center;color:var(--mut);margin:0 0 14px;font-size:13px}
.bn{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;display:flex;gap:4px;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -8px 24px #1e234022;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.bn button{flex:1;background:none;color:var(--mut);font-size:12px;padding:6px 2px;border-radius:14px;min-height:0;box-shadow:none;text-shadow:none}
.bn button:active{transform:none;box-shadow:none}
.bn button.on{color:#fff;background:linear-gradient(180deg,#8f73ff,#6c4cf1);box-shadow:0 3px 0 #4a30c4;text-shadow:0 1px 0 #0003}.bn span{display:block;font-size:22px;line-height:1.2}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding:2px 2px 8px}.tabs button{white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1e2340;color:#fff;padding:12px 18px;border-radius:14px;display:none;z-index:30;max-width:90%;box-shadow:0 8px 24px #0005}
.auth{max-width:420px;margin:0 auto;padding:18px 14px}
.mode{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:#fef3c7;color:#92400e}
.cf{position:fixed;top:-30px;font-style:normal;z-index:20;pointer-events:none;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(540deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
/* ======== কনফিগারেশন (নিজের তথ্য বসান) ======== */
const FB_CFG={
  apiKey: "AIzaSyBCIp6VtZyDHuY_X18VES2dlSOMoUEv24I",
  authDomain: "earnings2026-9ce20.firebaseapp.com",
  projectId: "earnings2026-9ce20",
  storageBucket: "earnings2026-9ce20.firebasestorage.app",
  messagingSenderId: "416515363985",
  appId: "1:416515363985:web:db6e8242ac1fc326ec1b30",
  measurementId: "G-026LRR87Z9"
}; // Firebase Web config: {apiKey:"..",authDomain:"..",projectId:"..",appId:".."} — null থাকলে ডেমো মোড
const ADS={client:'',slot:''}; // AdSense: client:'ca-pub-XXXXXXXXXXXXXXXX', slot:'1234567890'
/* ============================================ */
const FB=!!FB_CFG;let fs,au,subs=[];
const K='ptc_demo_v3';
const TT=[['📰','আর্টিকেল পড়ুন'],['🎬','ভিডিও দেখুন'],['🧠','কুইজ খেলুন'],['🛍️','অফার দেখুন'],['📱','অ্যাপ দেখুন']];
const seed=()=>Array.from({length:20},(_,i)=>{const[ic,n]=TT[i%5];return{id:'t'+(i+1),ord:i,icon:ic,title:n+' #'+(Math.floor(i/5)+1),url:'https://example.com/?task='+(i+1),sec:10+(i%4)*5,pts:10+(i%4)*5,on:1}});
function sampleRead(){return{id:'r1',ord:20,type:'read',icon:'📰',title:'আর্টিকেল সিরিজ (৩ পেজ)',per:15,sec:45,pts:30,on:1,url:'',pages:[
{title:'পেজ ১: ভূমিকা',body:'এটা নমুনা আর্টিকেল। অ্যাডমিন প্যানেলের টাস্ক ট্যাব থেকে নিজের আসল লেখা দিয়ে নতুন আর্টিকেল টাস্ক বানান।\n\nপ্রতিটি পেজে কয়েক সেকেন্ড থাকতে হবে এবং নিচে স্ক্রল করে পুরোটা পড়তে হবে।'},
{title:'পেজ ২: মূল আলোচনা',body:'এখানে বিষয়ের মূল অংশ থাকবে। ভালো ও কাজের লেখা দিলে ইউজার ফিরে আসবে।\n\nনমুনা লেখাটা বদলে নিন।'},
{title:'পেজ ৩: উপসংহার',body:'শেষ পেজে পৌঁছে "সম্পন্ন করুন" চাপলে পড়ার জন্য পয়েন্ট যোগ হবে।'}]}}

const LV=[[0,'ব্রোঞ্জ','🥉',0],[10,'সিলভার','🥈',10],[30,'গোল্ড','🥇',20],[70,'প্ল্যাটিনাম','💎',30],[150,'ডায়মন্ড','👑',50]];
const lvl=n=>{let i=0;LV.forEach((l,k)=>{if((n||0)>=l[0])i=k});return i};
const def=()=>({s:{name:'Smartpay',rate:100,minW:1000,ref:50,refMax:20,signup:20,cool:24,streak7:50,devLock:1,maint:0,wdOn:1,dailyCap:20,adCode:'',adH:250,admin:'admin',apass:'admin123',notice:'প্রতিদিন লগইন করে বোনাস নিন!'},u:[],w:[],l:[],r:[],dev:{},t:[...seed(),sampleRead()]});
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}D=D||def();D.r=D.r||[];D.dev=D.dev||{};
if(FB){D.t=[];D.u=[];D.w=[];D.l=[];D.r=[]}
let me=null,adm=false,tab='home',authMode='login',tick=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,9);
const U=()=>D.u.find(x=>x.id===me);
const tk=p=>'৳'+(p/D.s.rate).toFixed(2);
const fmt=t=>new Date(t).toLocaleString('bn-BD');
const today=()=>new Date().toISOString().slice(0,10);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)}
function sv(col,o){if(FB)fs.collection(col).doc(o.id).set(JSON.parse(JSON.stringify(o)),{merge:true}).catch(e=>toast('Error: '+e.code));else try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
function log(u,txt,p){const o={id:rid(),u,txt,p,at:Date.now()};D.l.unshift(o);sv('logs',o)}

/* ---------- ডিভাইস ফিঙ্গারপ্রিন্ট ---------- */
async function devKeys(){let id=null;try{id=localStorage.getItem('did')}catch(e){}
 if(!id){id=rid()+rid()+rid();try{localStorage.setItem('did',id)}catch(e){}}
 let cv='';try{const c=document.createElement('canvas').getContext('2d');c.font='14px Arial';c.fillText('EarnLink✓',2,15);cv=c.canvas.toDataURL()}catch(e){}
 const raw=[navigator.userAgent,screen.width,screen.height,screen.colorDepth,navigator.language,navigator.hardwareConcurrency,Intl.DateTimeFormat().resolvedOptions().timeZone,cv].join('|');
 let h=id;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,40)}catch(e){}
 return['a'+h,'b'+id]}
async function findRef(code){if(!code)return null;if(FB){const d=await fs.doc('codes/'+code).get();return d.exists?d.data().u:null}return D.u.find(x=>x.code===code)?.id||null}

/* ---------- Auth ---------- */
function authView(){
 const ref=new URLSearchParams(location.search).get('ref')||'',reg=authMode==='reg';
 return `<div class="hero" style="border-radius:0 0 40px 40px;text-align:center;padding:40px 16px"><div style="font-size:48px">💰</div><b style="font-size:30px">${esc(D.s.name)}</b><div>স্মার্ট টাস্ক • স্মার্ট রিওয়ার্ড • টাকা তুলুন</div></div>
 <div class="auth"><div class="card"><div style="text-align:center;margin-bottom:8px">${FB?'':'<span class="mode">ডেমো মোড – ডেটা শুধু এই ব্রাউজারে</span>'}</div>
 <label>ইউজারনেম</label><input id="a_u" autocomplete="username">
 <label>পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label><input id="a_p" type="password" autocomplete="current-password">
 ${reg?`<label>রেফার কোড (ঐচ্ছিক)</label><input id="a_r" value="${esc(ref)}">`:''}
 <button style="width:100%" onclick="doAuth()">${reg?'রেজিস্টার করুন':'লগইন'}</button>
 <p style="text-align:center"><a href="#" onclick="authMode='${reg?'login':'reg'}';render();return false">${reg?'একাউন্ট আছে? লগইন':'নতুন একাউন্ট খুলুন'}</a></p>
 ${FB?'':`<p class="mut" style="text-align:center">ডেমো অ্যাডমিন: ${esc(D.s.admin)} / ${esc(D.s.apass)}</p>`}</div></div>`}
async function doAuth(){
 const n=$('#a_u').value.trim().toLowerCase(),p=$('#a_p').value,em=n+'@earnlink.app';
 if(!/^[a-z0-9_]{3,20}$/.test(n)||p.length<6)return toast('ইউজারনেম (ইংরেজি/সংখ্যা, ৩+) ও পাসওয়ার্ড ৬+ অক্ষর দিন');
 try{
  if(!FB&&n===D.s.admin&&p===D.s.apass){adm=true;tab='dash';return render()}
  if(authMode==='reg'){
   const keys=await devKeys(),by=await findRef(($('#a_r')?.value||'').trim().toUpperCase());let id;
   if(FB){const c=await au.createUserWithEmailAndPassword(em,p);id=c.user.uid;
    if(D.s.devLock)for(const k of keys){if((await fs.doc('devices/'+k).get()).exists){await c.user.delete();return toast('এই ডিভাইস থেকে আগেই একাউন্ট খোলা হয়েছে')}}}
   else{if(D.u.some(x=>x.name===n))return toast('এই ইউজারনেম আছে');
    if(D.s.devLock&&keys.some(k=>D.dev[k]))return toast('এই ডিভাইস থেকে আগেই একাউন্ট খোলা হয়েছে');id=rid()}
   const u={id,name:n,pts:D.s.signup,code:rid().toUpperCase().slice(0,6),by:by&&by!==id?by:null,banned:0,done:{},pend:null,tasks:0,streak:0,last:'',joined:Date.now()};
   if(!FB)u.pass=p;
   keys.forEach(k=>{if(FB)fs.doc('devices/'+k).set({u:id});else D.dev[k]=id});
   if(FB)fs.doc('codes/'+u.code).set({u:id});
   if(u.by)(FB?sv:((c,o)=>D.r.push(o)))('refs',{id,by:u.by,ok:0,paid:0});
   if(!FB){D.u.push(u);me=id}
   sv('users',u);if(D.s.signup)log(id,'সাইনআপ বোনাস',D.s.signup);tab='home';toast('স্বাগতম! 🎉');return render()}
  if(FB)await au.signInWithEmailAndPassword(em,p);
  else{const u=D.u.find(x=>x.name===n&&x.pass===p);if(!u)return toast('ইউজারনেম/পাসওয়ার্ড ভুল');me=u.id;tab='home';render()}
 }catch(e){toast(e.code==='auth/email-already-in-use'?'এই ইউজারনেম আছে':e.code==='auth/invalid-credential'?'ইউজারনেম/পাসওয়ার্ড ভুল':(e.message||'সমস্যা হয়েছে'))}}
function logout(){rd=null;if(FB)au.signOut();me=null;adm=false;authMode='login';render()}

/* ---------- Firebase boot ---------- */
const ld=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function boot(){
 if(!FB)return render();
 $('#app').innerHTML='<p style="text-align:center;padding:40px">লোড হচ্ছে…</p>';
 try{const b='https://cdn.jsdelivr.net/npm/firebase@10.12.2/';
  await ld(b+'firebase-app-compat.js');await Promise.all([ld(b+'firebase-auth-compat.js'),ld(b+'firebase-firestore-compat.js')]);
  firebase.initializeApp(FB_CFG);fs=firebase.firestore();au=firebase.auth();au.onAuthStateChanged(onUser)}
 catch(e){$('#app').innerHTML='<p style="padding:30px">Firebase লোড হয়নি। কনফিগ ও নেটওয়ার্ক দেখুন।</p>'}}
async function onUser(us){
 subs.forEach(f=>f());subs=[];D.u=[];D.w=[];D.l=[];D.r=[];
 if(!us){me=null;adm=false;return render()}
 me=us.uid;adm=(await fs.doc('admins/'+me).get().catch(()=>({exists:false}))).exists;tab=adm?'dash':'home';
 const on=(q,f)=>subs.push(q.onSnapshot(s=>{f(s);render(1)},e=>console.warn(e.code)));
 const arr=s=>s.docs.map(d=>({id:d.id,...d.data()}));
 on(fs.doc('config/main'),s=>{if(s.exists)D.s={...D.s,...s.data()}});
 on(fs.collection('tasks'),s=>D.t=arr(s).sort((a,b)=>(a.ord||0)-(b.ord||0)));
 if(adm){on(fs.collection('users'),s=>D.u=arr(s));on(fs.collection('withdrawals'),s=>D.w=arr(s).sort((a,b)=>b.at-a.at))}
 else{on(fs.doc('users/'+me),s=>D.u=s.exists?[{id:s.id,...s.data()}]:[]);
  on(fs.collection('withdrawals').where('u','==',me),s=>D.w=arr(s).sort((a,b)=>b.at-a.at));
  on(fs.collection('logs').where('u','==',me),s=>D.l=arr(s).sort((a,b)=>b.at-a.at).slice(0,60));
  on(fs.collection('refs').where('by','==',me),s=>D.r=arr(s))}
 render()}

/* ---------- টাস্ক, বোনাস ---------- */
function startTask(id){const u=U(),t=D.t.find(x=>x.id===id);if(!t||!u)return;
 const l=u.done[id];if(l&&Date.now()-l<D.s.cool*3600e3)return toast('এই টাস্ক এখন আবার করা যাবে না');
 if(D.s.dailyCap&&Object.values(u.done).filter(x=>new Date(x).toISOString().slice(0,10)===today()).length>=D.s.dailyCap)return toast('আজকের টাস্ক লিমিট শেষ, কাল আবার আসুন');
 if(t.type==='read'){rd={tid:id,i:0,sec:0};scrollTo(0,0);return render()}
 u.pend={tid:id,start:Date.now()};sv('users',u);window.open(t.url,'_blank','noopener');render()}
function claim(){const u=U();if(!u||!u.pend)return;const t=D.t.find(x=>x.id===u.pend.tid);
 if(!t){u.pend=null;sv('users',u);return render()}
 if((Date.now()-u.pend.start)/1000<t.sec)return toast('আরও একটু অপেক্ষা করুন');
 const g=Math.round(t.pts*(1+LV[lvl(u.tasks)][3]/100)),first=!u.tasks,old=lvl(u.tasks);
 u.pts+=g;u.tasks=(u.tasks||0)+1;u.done[t.id]=Date.now();u.pend=null;log(u.id,'টাস্ক: '+t.title,g);
 if(first&&u.by){if(FB)sv('refs',{id:u.id,by:u.by,ok:1});else{const r=D.r.find(x=>x.id===u.id);if(r)r.ok=1}}
 sv('users',u);boom();toast('+'+g+' পয়েন্ট! '+(lvl(u.tasks)>old?'🎉 লেভেল আপ: '+LV[lvl(u.tasks)][1]:''));render()}
const cancelTask=()=>{const u=U();u.pend=null;sv('users',u);render()};
function daily(){const u=U(),t=today();if(u.last===t)return toast('আজকের বোনাস নেওয়া হয়েছে');
 const y=new Date(Date.now()-864e5).toISOString().slice(0,10);u.streak=u.last===y?(u.streak||0)+1:1;u.last=t;
 let b=Math.min(5+u.streak*2,25),x='';if(u.streak%7===0){b+=D.s.streak7;x=' (৭ দিনের স্ট্রিক বোনাস সহ!)'}
 u.pts+=b;log(u.id,'ডেইলি বোনাস – স্ট্রিক '+u.streak,b);sv('users',u);boom();toast('+'+b+' পয়েন্ট'+x);render()}
function collect(){const u=U();if(!u)return;const open=D.r.filter(r=>r.ok&&!r.paid);if(!open.length)return;
 const can=Math.max(0,D.s.refMax-D.r.filter(r=>r.paid).length),take=open.slice(0,can);if(!take.length)return;
 take.forEach(r=>{r.paid=1;sv('refs',r)});const b=take.length*D.s.ref;u.pts+=b;log(u.id,'রেফার বোনাস ×'+take.length,b);sv('users',u);toast('রেফার বোনাস +'+b)}
function doWd(){const u=U(),amt=parseInt($('#w_a').value),m=$('#w_m').value,no=$('#w_n').value.trim();
 if(!D.s.wdOn)return toast('উইথড্র সাময়িক বন্ধ আছে');
 if(!amt||amt<D.s.minW)return toast('ন্যূনতম '+D.s.minW+' পয়েন্ট');if(amt>u.pts)return toast('পর্যাপ্ত পয়েন্ট নেই');
 if(!/^01\d{9}$/.test(no))return toast('সঠিক নম্বর দিন (01XXXXXXXXX)');
 if(D.w.some(w=>w.u===u.id&&w.st==='pending'))return toast('আগের রিকোয়েস্ট পেন্ডিং আছে');
 u.pts-=amt;const w={id:rid(),u:u.id,uname:u.name,amt,m,no,st:'pending',at:Date.now()};D.w.unshift(w);
 log(u.id,'উইথড্র রিকোয়েস্ট',-amt);sv('users',u);sv('withdrawals',w);toast('রিকোয়েস্ট পাঠানো হয়েছে');render()}
function wdSet(id,st){const w=D.w.find(x=>x.id===id);if(!w||w.st!=='pending')return;w.st=st;
 if(st==='rejected'){const u=D.u.find(x=>x.id===w.u);if(u){u.pts+=w.amt;log(u.id,'উইথড্র বাতিল – ফেরত',w.amt);sv('users',u)}}sv('withdrawals',w);render()}

  body=`<div class="card row"><div><b>🔥 ডেইলি বোনাস</b><div class="mut">স্ট্রিক: ${u.streak||0} দিন · ৭ দিন পূর্ণ হলে +${D.s.streak7}</div></div><button class="${got?'sec':'ok'}" ${got?'disabled':''} onclick="daily()">${got?'নেওয়া হয়েছে ✓':'বোনাস নিন'}</button></div>`+pend+
  D.t.filter(t=>t.on).map((t,i)=>{const l=u.done[t.id],dn=l&&Date.now()-l<D.s.cool*3600e3,g=Math.round(t.pts*(1+LV[L][3]/100));

  <div><label>ডিভাইস লক</label><select id="s_devLock"><option value="1" ${s.devLock?'selected':''}>চালু</option><option value="0" ${s.devLock?'':'selected'}>বন্ধ (টেস্টের জন্য)</option></select></div><div><label>মেইনটেন্যান্স মোড</label><select id="s_maint"><option value="0" ${s.maint?'':'selected'}>বন্ধ</option><option value="1" ${s.maint?'selected':''}>চালু</option></select></div><div><label>উইথড্র</label><select id="s_wdOn"><option value="1" ${s.wdOn?'selected':''}>চালু</option><option value="0" ${s.wdOn?'':'selected'}>বন্ধ</option></select></div>${f('dailyCap','দৈনিক টাস্ক লিমিট (0 = সীমাহীন)')}</div>
  ${f('notice','নোটিশ','text')}${FB?'':f('admin','অ্যাডমিন ইউজারনেম (ডেমো)','text')+f('apass','অ্যাডমিন পাসওয়ার্ড (ডেমো)','text')}
  <label>Adsterra অ্যাড কোড (পেস্ট করুন, হোম, রেফার ও আর্টিকেল পেজে দেখাবে)</label><textarea id="s_adCode" rows="5">${esc(s.adCode||'')}</textarea>${f('adH','অ্যাড ইউনিটের উচ্চতা (px)')}
  <button onclick="saveSet()">সেভ</button> ${FB?'':`<button class="bad" onclick="if(confirm('সব ডেটা মুছবে?')){D=def();sv();logout()}">ডেটা রিসেট</button>`}</div>`}
 return `<div class="hero"><div class="r"><b>🛠 অ্যাডমিন প্যানেল</b><button class="sec" onclick="logout()">লগআউট</button></div></div><div class="wrap"><div class="tabs" style="margin-top:12px">${Object.entries(tabs).map(([k,v])=>`<button class="${tab===k?'':'sec'}" onclick="tab='${k}';render()">${v}</button>`).join('')}</div>${b}</div>`}
const putT=t=>{if(FB)fs.doc('tasks/'+t.id).set(t);else{const i=D.t.findIndex(x=>x.id===t.id);i<0?D.t.push(t):D.t[i]=t;sv()}};
function addTask(){const t=$('#n_t').value.trim(),u=$('#n_u').value.trim();if(!t||!/^https?:\/\//.test(u))return toast('টাইটেল ও সঠিক লিংক দিন');
 putT({id:rid(),ord:D.t.length,icon:$('#n_i').value||'⭐',title:t,url:u,sec:+$('#n_s').value||10,pts:+$('#n_p').value||1,on:1});render()}
function editTask(id){const t=D.t.find(x=>x.id===id);if(t.type==='read'){t.title=prompt('টাইটেল',t.title)||t.title;t.pts=+prompt('পয়েন্ট',t.pts)||t.pts;t.per=+prompt('প্রতি পেজ সেকেন্ড',t.per)||t.per;t.sec=(t.pages||[]).length*t.per;putT(t);return render()}const u=prompt('নতুন লিংক',t.url);if(u&&/^https?:\/\//.test(u)){t.url=u;t.title=prompt('টাইটেল',t.title)||t.title;t.pts=+prompt('পয়েন্ট',t.pts)||t.pts;t.sec=+prompt('সেকেন্ড',t.sec)||t.sec;putT(t);render()}}
const togTask=id=>{const t=D.t.find(x=>x.id===id);t.on=t.on?0:1;putT(t);render()};
const delTask=id=>{if(!confirm('মুছবেন?'))return;if(FB)fs.doc('tasks/'+id).delete();else{D.t=D.t.filter(x=>x.id!==id);sv()}render()};
const ban=id=>{const u=D.u.find(x=>x.id===id);u.banned=u.banned?0:1;sv('users',u);render()};
function adjPts(id){const u=D.u.find(x=>x.id===id),v=parseInt(prompt('পয়েন্ট যোগ/বিয়োগ (যেমন 50 বা -50)','0'));if(!v)return;u.pts=Math.max(0,u.pts+v);log(id,'অ্যাডমিন অ্যাডজাস্ট',v);sv('users',u);render()}
function seedTasks(){[...seed(),sampleRead()].forEach(putT);if(FB)saveSet(1);render()}
function saveSet(q){const s=D.s;if(!q){['name','notice','admin','apass'].forEach(k=>{const e=$('#s_'+k);if(e)s[k]=e.value.trim()||s[k]});
 ['rate','minW','ref','refMax','signup','cool','streak7','dailyCap'].forEach(k=>s[k]=Math.max(0,+$('#s_'+k).value)||(k==='rate'?100:0));s.devLock=+$('#s_devLock').value;s.maint=+$('#s_maint').value;s.wdOn=+$('#s_wdOn').value;s.adCode=$('#s_adCode').value.trim();s.adH=+$('#s_adH').value||250}
 if(FB){const c={...s};delete c.admin;delete c.apass;fs.doc('config/main').set(c,{merge:true})}else sv();if(!q){toast('সেভ হয়েছে');render()}}

let rd=null;
addEventListener('scroll',()=>{if(rd)rdUp()},{passive:true});
function readerView(){
 const t=D.t.find(x=>x.id===rd.tid);if(!t||!t.pages){rd=null;return userView()}
 const p=t.pages[rd.i],n=t.pages.length,last=rd.i===n-1;
 const AC=t.adCode||D.s.adCode;const ad=AC?`<iframe sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" srcdoc="${esc('<body style="margin:0;display:flex;justify-content:center">'+AC+'</body>')}" style="width:100%;height:${+D.s.adH||250}px;border:0;margin-bottom:14px"></iframe>`:'<div class="ad">📢 Adsterra অ্যাড এখানে দেখাবে (অ্যাডমিন সেটিংসে অ্যাড কোড বসান)</div>';
 return `<div class="hero"><div class="r"><b>${t.icon||'📰'} ${esc(t.title)}</b><button class="sec" onclick="rdExit()" style="padding:4px 10px">✕</button></div><div style="margin-top:10px" class="bar"><i style="width:${rd.i/n*100}%"></i></div><div style="font-size:13px;margin-top:4px">পেজ ${rd.i+1} / ${n}</div></div>
 <div class="wrap">${ad}<div class="card"><h2 style="margin:0 0 8px">${esc(p.title)}</h2><div style="white-space:pre-wrap">${esc(p.body)}</div></div>
 <div class="card row"><span class="mut" id="rdm"></span><button id="rdb" disabled onclick="rdNext()">${last?'✅ সম্পন্ন করুন':'পরের পেজ →'}</button></div></div>`}
function rdUp(){const t=rd&&D.t.find(x=>x.id===rd.tid),b=$('#rdb'),m=$('#rdm');if(!t||!b)return;
 const left=Math.max(0,(t.per||15)-rd.sec),sc=window.scrollY+innerHeight>=document.documentElement.scrollHeight-60;
 b.disabled=left>0||!sc;m.textContent=left?'⏱ '+left+' সেকেন্ড অপেক্ষা করুন':(sc?'পড়া শেষ ✓':'⬇ নিচে স্ক্রল করে পুরোটা পড়ুন')}
function rdNext(){const t=D.t.find(x=>x.id===rd.tid);
 if(rd.i<t.pages.length-1){rd.i++;rd.sec=0;scrollTo(0,0);render()}
 else{const u=U();u.pend={tid:t.id,start:Date.now()-(t.sec+2)*1000};rd=null;claim()}}
const rdExit=()=>{rd=null;render()};
function addRead(){const t=$('#r_t').value.trim(),per=+$('#r_s').value||15;
 const pages=$('#r_b').value.trim().split(/\n-{3,}\n/).map(x=>{const l=x.trim().split('\n');return{title:l[0].trim(),body:l.slice(1).join('\n').trim()}}).filter(p=>p.title&&p.body);
 if(!t||pages.length<2)return toast('টাইটেল ও কমপক্ষে ২টা পেজ দিন (পেজ আলাদা করতে --- লিখুন)');
 putT({id:rid(),ord:D.t.length,type:'read',icon:$('#r_i').value||'📰',title:t,pages,per,sec:pages.length*per,pts:+$('#r_p').value||20,on:1,url:'',adCode:($('#r_a').value||'').trim()});render()}
function boom(){const e=['🪙','⭐','✨','🎉','💎'];for(let i=0;i<26;i++){const p=document.createElement('i');p.className='cf';p.textContent=e[i%5];p.style.cssText=`left:${Math.random()*100}vw;--dx:${(Math.random()-.5)*220}px;animation-delay:${Math.random()*.35}s;font-size:${16+Math.random()*16}px`;document.body.appendChild(p);setTimeout(()=>p.remove(),2400)}}
/* ---------- Render ---------- */
function render(soft){
 if(soft&&(rd||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName)))return;
 $('#app').innerHTML=adm?adminView():me?(rd?readerView():userView()):authView();
 clearInterval(tick);const u=me&&!adm&&U();if(rd){tick=setInterval(()=>{if(!document.hidden)rd.sec++;rdUp()},1000);rdUp()}
 if(u&&u.pend&&tab==='home'){const t=D.t.find(x=>x.id===u.pend.tid);if(t){const up=()=>{const el=(Date.now()-u.pend.start)/1000,left=Math.max(0,Math.ceil(t.sec-el)),cd=$('#cd');if(!cd)return;
  cd.textContent=left?`নতুন ট্যাবে ${t.sec} সেকেন্ড থাকুন — বাকি: ${left}s`:'সময় শেষ! এখন পয়েন্ট নিন।';$('#pb').style.width=Math.min(100,el/t.sec*100)+'%';$('#cl').disabled=left>0;if(!left)clearInterval(tick)};up();tick=setInterval(up,500)}}
 pushAds()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me&&!adm&&U()?.pend&&tab==='home'&&!rd)render()});
boot();
</script>
</body>
</html>
